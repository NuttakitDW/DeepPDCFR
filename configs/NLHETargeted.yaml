algo_name: PostflopVRDeepPDCFR

# Narrowed scenario: target SPR ~7.8 (stack 477, pot 61)
stack_range: [400, 550]
pot_range: [50, 75]

# Fixed bet sizes matching target spot
fixed_oop_bet_config:
  bet:
    - {"PotRelative": 0.33}
  raise:
    - {"PotRelative": 0.33}
    - {"PotRelative": 0.60}
fixed_ip_bet_config:
  bet:
    - {"PotRelative": 0.25}
    - {"PotRelative": 0.55}
    - {"PotRelative": 0.85}
    - {"PotRelative": 1.25}
  raise:
    - {"PotRelative": 0.33}
    - {"PotRelative": 0.60}

# Training (external sampling)
num_iterations: 0
num_traversals: 5000
evaluation_frequency: 3
epsilon: 0.6

# Regret networks
advantage_buffer_size: 10000
advantage_batch_size: 1024
advantage_network_train_steps: 300
reinitialize_advantage_networks: False
reinitialize_imm_regret_networks: True
use_regret_matching_argmax: True
alpha: 2.3

# Policy network
ave_policy_buffer_size: 20000
ave_policy_batch_size: 1024
ave_policy_network_train_steps: 300
gamma: 2

# Shared
learning_rate: 3.0e-4

# V2 model architecture
card_embed_dim: 64
situation_hidden: 384
combo_hidden: 192
fusion_hidden: 384
fusion_residual_blocks: 2

# System
device: cuda
max_time: 0
save_interval: 600
save_dir: models/NLHETargeted
resume: False
seed: 0
traversal_workers: 8
traversal_device: null
traversal_mp_context: spawn
traversal_chunk_size: 0
